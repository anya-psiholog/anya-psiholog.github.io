<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="/img/icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/img/icon-48.png" sizes="48x48" type="image/png">
<link rel="apple-touch-icon" href="/img/icon-180.png">
<meta name="theme-color" content="#FAF4EE">
<title>Страница не найдена — Аня, ты психолог</title>
<link rel="preload" href="/fonts/caveat-700-cyr.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/onest-cyr.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Caveat';font-weight:700;font-display:swap;src:url(/fonts/caveat-700-cyr.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Caveat';font-weight:700;font-display:swap;src:url(/fonts/caveat-700-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD}
@font-face{font-family:'Onest';font-weight:400 600;font-display:swap;src:url(/fonts/onest-cyr.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Onest';font-weight:400 600;font-display:swap;src:url(/fonts/onest-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD}
@font-face{font-family:'Onest';font-weight:400 600;font-display:swap;src:url(/fonts/onest-latinext.woff2) format('woff2');unicode-range:U+0100-02BA,U+20A0-20C4}
@font-face{font-family:'Caveat Fallback';src:local('Arial Narrow'),local('ArialNarrow'),local('Arial');size-adjust:78%;ascent-override:118%}
@font-face{font-family:'Onest Fallback';src:local('Arial'),local('Helvetica'),local('Roboto');size-adjust:98%}
:root{
  --milk:#FAF4EE;--ink:#1F1C1A;--muted:#6B635D;--orange:#F26B21;--orange-text:#E25C14;--line:#E6DBD0;--card:#FFFDFB;
  --hand:'Caveat','Caveat Fallback',sans-serif;--text:'Onest','Onest Fallback',system-ui,sans-serif;
  --fs-h2:72px;--fs-h3:32px;--fs-text:19px;--fs-small:15px;--space:160px;--margin:80px;--maxw:1280px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--milk);color:var(--ink);font:400 var(--fs-text)/1.6 var(--text);-webkit-font-smoothing:antialiased}
a{color:inherit;text-underline-offset:4px;text-decoration-thickness:1.5px}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:4px}
.wrap{max-width:calc(var(--maxw) + 2*var(--margin));margin:0 auto;padding:0 var(--margin)}
.top{display:flex;align-items:center;justify-content:space-between;height:72px}
.logo{font:700 var(--fs-h3)/1 var(--hand);text-decoration:none}.logo span{color:var(--orange-text)}
.back{font:500 var(--fs-small)/1.4 var(--text)}
main.wrap{padding-top:var(--space);padding-bottom:var(--space)}
.doc{max-width:760px}
h1{font:700 var(--fs-h2)/.95 var(--hand);letter-spacing:-.5px}
.date{margin-top:24px;font-size:var(--fs-small);color:var(--muted)}
.lead{margin-top:40px}
h2{font:700 var(--fs-h3)/1.1 var(--hand);margin:56px 0 12px}
p+p,ul,ol{margin-top:12px}
ul,ol{padding-left:1.2em}
li+li{margin-top:6px}
.note{margin-top:40px;padding:24px 28px;background:var(--card);font-size:var(--fs-small);line-height:1.5;color:#4A4540}
footer{background:var(--ink);color:var(--milk)}
footer .wrap{padding-top:var(--space);padding-bottom:var(--space);display:flex;flex-wrap:wrap;gap:12px 32px;font:400 var(--fs-small)/1.5 var(--text)}
@media (max-width:760px){
  :root{--fs-h2:44px;--fs-h3:26px;--fs-text:17px;--fs-small:14px;--space:96px;--margin:20px}
  .top{height:56px}
  .back,footer a{display:inline-block;padding:11px 0}
  h2{margin-top:40px}
  .note{padding:20px}
}
</style>
</head>
<body>
<header class="wrap top"><a class="logo" href="/">Аня, ты&nbsp;псих<span>олог</span></a><a class="back" href="/">← На&nbsp;главную</a></header>
<main class="wrap"><article class="doc">
<h1>Такой страницы нет</h1>
<p class="lead">Возможно, ссылка устарела или в&nbsp;адресе опечатка.</p>
<p><a href="/">Перейти на&nbsp;главную</a> или&nbsp;написать мне в&nbsp;<a href="https://t.me/al_annn" target="_blank" rel="noopener">Telegram</a>.</p>
</article></main>
</body>
</html>
